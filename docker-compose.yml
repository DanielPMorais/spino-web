services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${SPINO_HTTP_BIND:-127.0.0.1}:${SPINO_HTTP_PORT:-8080}:80"
    volumes:
      # Persist only application data. Do not mount over database/ because the
      # migrations shipped in the image must remain available.
      - "${SPINO_DATA_PATH:-./data}:/var/www/html/storage/app"
    restart: unless-stopped
    init: true
